name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    # Доменные пакеты (packages/domain/*) тестируются на реальном Postgres,
    # не моками (см. docs/QUALITY_STANDARDS.md) — сервис ниже поднимает ту
    # же схему, что и в локальной разработке (packages/db-schema).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: garmentos
          POSTGRES_PASSWORD: garmentos
          # apps/api/vitest.setup.ts (ARCHITECTURE_REVIEW.md, находка 2.3, P0)
          # безусловно переписывает DATABASE_URL на базу с суффиксом "_test"
          # для ЛЮБОГО vitest-прогона — это единственная база, к которой
          # реально подключаются e2e-тесты apps/api в этом job'е. База здесь
          # сразу называется "garmentos_test", чтобы редирект в vitest.setup.ts
          # был no-op (dbName уже оканчивается на "_test"), а не пытался
          # подключиться к несуществующей "garmentos_test_test" — и чтобы
          # миграции ниже применялись именно к той базе, которую увидят тесты.
          POSTGRES_DB: garmentos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garmentos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://garmentos:garmentos@localhost:5432/garmentos_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @garmentos/db-schema db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
