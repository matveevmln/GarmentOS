# Локальная разработка / эталонный Lean-стек Фазы 1 (docs/INFRASTRUCTURE.md, раздел 3).
# Полностью переносимо: тот же compose-файл поднимается на любой из целевых
# площадок (self-hosted, Кыргызстан, Yandex Cloud, VK Cloud, AWS, GCP, Azure).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: garmentos
      POSTGRES_PASSWORD: garmentos
      POSTGRES_DB: garmentos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garmentos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: garmentos
      MINIO_ROOT_PASSWORD: garmentos-local-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://garmentos:garmentos@postgres:5432/garmentos
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # apps/web (Итерация 11) — браузерный SPA на другом origin/порту;
      # без этого apps/api отклоняет запросы браузера (main.ts, enableCors).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4173}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        # Vite встраивает эту переменную в бандл во время сборки — не
        # переменная окружения контейнера в рантайме (см. web.Dockerfile).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/v1}
    restart: unless-stopped
    ports:
      - "4173:4173"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
