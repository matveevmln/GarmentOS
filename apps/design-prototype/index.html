<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GarmentOS — UI Prototype v2</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></symbol>
<symbol id="i-batch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 12 3.5l8 4v9L12 20.5l-8-4z"/><path d="M4 7.5 12 11.5l8-4"/><path d="M12 11.5v9"/></symbol>
<symbol id="i-model" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5 5 6v4l2 .8V20.5h10V10.8L19 10V6l-4-2.5"/><path d="M9 3.5c0 1.7 1.3 2.8 3 2.8s3-1.1 3-2.8"/></symbol>
<symbol id="i-factory" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20.5V10l5 3.2V10l5 3.2V6.5l6 3.8v10.2z"/><path d="M7 20.5v-3M12 20.5v-3M17 20.5v-3"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 3.5 8 12 12.5 20.5 8z"/><path d="M3.5 12.5 12 17l8.5-4.5"/><path d="M3.5 17 12 21.5l8.5-4.5"/></symbol>
<symbol id="i-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11h9.8l2.2-8H6"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></symbol>
<symbol id="i-store" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v10.5h16V10"/><path d="M3 6.5 4.5 3.5h15L21 6.5a2.5 2.5 0 0 1-4.5 1.5 2.5 2.5 0 0 1-4.5 0 2.5 2.5 0 0 1-4.5 0A2.5 2.5 0 0 1 3 6.5"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15 14.3c2.6.4 4.5 2.6 4.5 5.7"/></symbol>
<symbol id="i-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h7.5L18.5 7.5V21h-12z"/><path d="M14 3v5h4.5"/><path d="M9.5 12.5h6M9.5 16h6"/></symbol>
<symbol id="i-cash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 10h.01M18 14h.01"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v6c0 4.4 3 8 7 9 4-1 7-4.6 7-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4-4"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 16V10.5a6 6 0 1 0-12 0V16l-1.5 2.5h15z"/><path d="M10 21h4"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></symbol>
<symbol id="i-dots" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="18.5" r="1.7"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h.01M12 6h.01M19 6h.01M5 12h.01M12 12h.01M19 12h.01M5 18h.01M12 18h.01M19 18h.01"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.5h.01"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m8 11.5 4 4 4-4"/><path d="M5 19.5h14"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6"/><circle cx="12" cy="12" r="2.7"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4 5.3 5.3"/></symbol>
</defs></svg>

<div class="shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="logo"><svg class="ico" width="15" height="15"><use href="#i-batch"/></svg></span>
      <span class="name">GarmentOS</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-group">
        <a class="nav-item" data-go="dashboard"><svg class="ico"><use href="#i-home"/></svg><span class="label">Главная</span></a>
      </div>
      <div class="nav-group">
        <div class="caption">Производство</div>
        <a class="nav-item" data-go="batches"><svg class="ico"><use href="#i-batch"/></svg><span class="label">Партии</span><span class="badge-n badge">7</span></a>
        <a class="nav-item" data-go="models"><svg class="ico"><use href="#i-model"/></svg><span class="label">Модели</span></a>
        <a class="nav-item" data-go="workshops"><svg class="ico"><use href="#i-factory"/></svg><span class="label">Цеха</span></a>
      </div>
      <div class="nav-group">
        <div class="caption">Ресурсы</div>
        <a class="nav-item" data-go="materials"><svg class="ico"><use href="#i-layers"/></svg><span class="label">Материалы</span></a>
        <a class="nav-item" data-go="purchases"><svg class="ico"><use href="#i-cart"/></svg><span class="label">Закупки</span></a>
        <a class="nav-item" data-go="warehouses"><svg class="ico"><use href="#i-store"/></svg><span class="label">Склады</span></a>
        <a class="nav-item" data-go="suppliers"><svg class="ico"><use href="#i-users"/></svg><span class="label">Поставщики</span></a>
      </div>
      <div class="nav-group">
        <div class="caption">Управление</div>
        <a class="nav-item" data-go="documents"><svg class="ico"><use href="#i-doc"/></svg><span class="label">Документы</span></a>
        <a class="nav-item" data-go="finance"><svg class="ico"><use href="#i-cash"/></svg><span class="label">Финансы</span></a>
        <a class="nav-item" data-go="pilot"><svg class="ico"><use href="#i-shield"/></svg><span class="label">Pilot v1</span></a>
      </div>
    </nav>
    <div class="sidebar-foot">
      <span class="avatar">БМ</span>
      <div class="who" style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600">Богдан М.</div>
        <div style="font-size:11px" class="muted-3">Владелец</div>
      </div>
    </div>
  </aside>

  <!-- ============ TOPBAR ============ -->
  <header class="topbar">
    <button class="iconbtn back only-mobile" data-back aria-label="Назад"><svg class="ico" width="20" height="20"><use href="#i-back"/></svg></button>
    <div class="crumbs" id="crumbs"></div>
    <div class="m-title" id="mtitle"></div>
    <div class="topbar-actions">
      <button class="iconbtn" aria-label="Поиск"><svg class="ico" width="19" height="19"><use href="#i-search"/></svg></button>
      <button class="iconbtn" aria-label="Уведомления"><svg class="ico" width="19" height="19"><use href="#i-bell"/></svg><i class="dot"></i></button>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="main"><div class="page" id="page"></div></main>

  <!-- ============ BOTTOM NAV (mobile) ============ -->
  <nav class="bottomnav">
    <a data-go="dashboard"><svg class="ico"><use href="#i-home"/></svg>Главная</a>
    <a data-go="batches"><svg class="ico"><use href="#i-batch"/></svg>Партии</a>
    <a class="fab" data-go="create" aria-label="Создать"><svg class="ico" width="22" height="22"><use href="#i-plus"/></svg></a>
    <a data-go="documents"><svg class="ico"><use href="#i-doc"/></svg>Документы</a>
    <a data-go="more"><svg class="ico"><use href="#i-grid"/></svg>Ещё</a>
  </nav>

</div>

<script src="data.js"></script>
<script src="screens.js"></script>
<script src="app.js"></script>
</body>
</html>
